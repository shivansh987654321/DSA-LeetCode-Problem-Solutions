<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS — Billing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><h2><i class="bi bi-hospital"></i> HMS</h2><small>Hospital Management</small></div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto;">
      <a class="nav-item" id="logoutBtn" style="color:#f87171;"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <h3>Billing</h3>
      <div class="topbar-right">
        <div class="user-badge">
          <div class="user-avatar" id="topbarAvatar">A</div>
          <div><div style="font-size:0.85rem;font-weight:600;" id="topbarUser">User</div>
          <div class="role-chip" id="topbarRole">role</div></div>
        </div>
      </div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h2>Billing &amp; Payments</h2>
        <button class="btn btn-primary" id="genBillBtn"><i class="bi bi-plus-lg"></i> Generate Bill</button>
      </div>

      <!-- Summary cards -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px;">
        <div class="stat-card stat-green">
          <div class="stat-icon"><i class="bi bi-check-circle-fill"></i></div>
          <div class="stat-value" id="totalPaid">—</div>
          <div class="stat-label">Paid Bills</div>
        </div>
        <div class="stat-card stat-orange">
          <div class="stat-icon"><i class="bi bi-clock-fill"></i></div>
          <div class="stat-value" id="totalPending">—</div>
          <div class="stat-label">Pending Bills</div>
        </div>
        <div class="stat-card stat-blue">
          <div class="stat-icon"><i class="bi bi-currency-rupee"></i></div>
          <div class="stat-value" id="totalRevenue">—</div>
          <div class="stat-label">Total Revenue (₹)</div>
        </div>
      </div>

      <!-- Filter -->
      <div class="card" style="margin-bottom:16px;">
        <div class="card-body" style="display:flex;gap:12px;padding:14px 16px;">
          <select class="form-control" id="filterStatus" style="max-width:180px;">
            <option value="">All Statuses</option>
            <option>pending</option><option>paid</option><option>partially paid</option>
          </select>
          <button class="btn btn-secondary" id="applyFilter"><i class="bi bi-funnel"></i> Filter</button>
          <button class="btn btn-secondary" id="clearFilter">Clear</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0;">
          <table class="table">
            <thead>
              <tr><th>Bill #</th><th>Patient</th><th>Amount (₹)</th><th>Status</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody id="billsTable">
              <tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bill Modal -->
<div class="modal-overlay" id="billModal">
  <div class="modal-box">
    <div class="modal-header">
      <h4 id="billModalTitle">Generate Bill</h4>
      <button class="modal-close" id="closeBillModal">&times;</button>
    </div>
    <input type="hidden" id="editBillId" />
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Patient *</label>
        <select class="form-control" id="billPatient"><option value="">Select Patient…</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (₹) *</label>
        <input type="number" class="form-control" id="billAmount" placeholder="0.00" min="0" step="0.01" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Payment Status</label>
        <select class="form-control" id="billStatus">
          <option>pending</option><option>paid</option><option>partially paid</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-control" id="billDate" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Appointment (optional)</label>
      <select class="form-control" id="billAppt"><option value="">None</option></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelBillModal">Cancel</button>
      <button class="btn btn-primary" id="saveBill">Save Bill</button>
    </div>
  </div>
</div>

<!-- Invoice Modal -->
<div class="modal-overlay" id="invoiceModal">
  <div class="modal-box">
    <div class="modal-header">
      <h4>Invoice</h4>
      <button class="modal-close" onclick="document.getElementById('invoiceModal').classList.remove('show')">&times;</button>
    </div>
    <div id="invoiceContent"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('invoiceModal').classList.remove('show')">Close</button>
      <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  let currentUser = initPage('billing', ['admin', 'receptionist', 'patient']);
  let allBills = [];
  if (currentUser) { loadBills(); populateDropdowns(); }

  function statusBadge(s) {
    return { paid: 'badge-success', pending: 'badge-warning', 'partially paid': 'badge-primary' }[s] || 'badge-secondary';
  }

  async function loadBills(filters = {}) {
    let ep = '/bills?';
    if (filters.status) ep += `payment_status=${filters.status}`;
    const res = await api.get(ep);
    if (!res || !res.ok) return;
    allBills = res.data;

    const paid    = allBills.filter(b => b.payment_status === 'paid').length;
    const pending = allBills.filter(b => b.payment_status === 'pending').length;
    const revenue = allBills.filter(b => b.payment_status === 'paid').reduce((s, b) => s + b.amount, 0);

    document.getElementById('totalPaid').textContent = paid;
    document.getElementById('totalPending').textContent = pending;
    document.getElementById('totalRevenue').textContent = revenue.toLocaleString();

    const canManage = ['admin', 'receptionist'].includes(currentUser.role);
    const tbody = document.getElementById('billsTable');

    if (!allBills.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">No bills found</td></tr>';
      return;
    }

    tbody.innerHTML = allBills.map(b => `
      <tr>
        <td>INV-${b.bill_id.toString().padStart(4,'0')}</td>
        <td>${b.patient_name}</td>
        <td>₹${b.amount.toLocaleString()}</td>
        <td><span class="badge ${statusBadge(b.payment_status)}">${b.payment_status}</span></td>
        <td>${b.date}</td>
        <td>
          <button class="btn btn-primary btn-sm btn-icon" onclick="viewInvoice(${b.bill_id})" title="Invoice"><i class="bi bi-receipt"></i></button>
          ${canManage ? `<button class="btn btn-secondary btn-sm btn-icon" onclick="editBill(${b.bill_id})"><i class="bi bi-pencil"></i></button>` : ''}
          ${b.payment_status !== 'paid' ? `<button class="btn btn-success btn-sm" onclick="payBill(${b.bill_id})"><i class="bi bi-check-lg"></i> Pay</button>` : ''}
          ${currentUser.role === 'admin' ? `<button class="btn btn-danger btn-sm btn-icon" onclick="deleteBill(${b.bill_id})"><i class="bi bi-trash"></i></button>` : ''}
        </td>
      </tr>`).join('');
  }

  async function populateDropdowns() {
    const [pRes, aRes] = await Promise.all([api.get('/patients'), api.get('/appointments')]);
    if (pRes && pRes.ok) {
      document.getElementById('billPatient').innerHTML =
        '<option value="">Select Patient…</option>' +
        pRes.data.map(p => `<option value="${p.patient_id}">${p.name}</option>`).join('');
    }
    if (aRes && aRes.ok) {
      document.getElementById('billAppt').innerHTML =
        '<option value="">None</option>' +
        aRes.data.map(a => `<option value="${a.appointment_id}">${a.patient_name} - ${a.date} ${a.time}</option>`).join('');
    }
  }

  const modal = document.getElementById('billModal');
  document.getElementById('genBillBtn').addEventListener('click', () => {
    document.getElementById('billModalTitle').textContent = 'Generate Bill';
    document.getElementById('editBillId').value = '';
    document.getElementById('billPatient').value = '';
    document.getElementById('billAmount').value = '';
    document.getElementById('billStatus').value = 'pending';
    document.getElementById('billDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('billAppt').value = '';
    modal.classList.add('show');
  });

  document.getElementById('closeBillModal').addEventListener('click', () => modal.classList.remove('show'));
  document.getElementById('cancelBillModal').addEventListener('click', () => modal.classList.remove('show'));

  async function editBill(id) {
    const b = allBills.find(x => x.bill_id === id);
    if (!b) return;
    document.getElementById('billModalTitle').textContent = 'Edit Bill';
    document.getElementById('editBillId').value = b.bill_id;
    document.getElementById('billPatient').value = b.patient_id;
    document.getElementById('billAmount').value = b.amount;
    document.getElementById('billStatus').value = b.payment_status;
    document.getElementById('billDate').value = b.date;
    document.getElementById('billAppt').value = b.appointment_id || '';
    modal.classList.add('show');
  }

  document.getElementById('saveBill').addEventListener('click', async () => {
    const patient_id = document.getElementById('billPatient').value;
    const amount     = document.getElementById('billAmount').value;
    if (!patient_id || !amount) { showToast('Patient and amount required', 'error'); return; }

    const body = {
      patient_id: parseInt(patient_id),
      amount: parseFloat(amount),
      payment_status: document.getElementById('billStatus').value,
      date: document.getElementById('billDate').value,
      appointment_id: document.getElementById('billAppt').value || null,
    };

    const editId = document.getElementById('editBillId').value;
    const res = editId ? await api.put(`/bills/${editId}`, body) : await api.post('/bills', body);
    if (res && res.ok) {
      showToast(editId ? 'Bill updated' : 'Bill generated', 'success');
      modal.classList.remove('show');
      loadBills();
    } else showToast((res && res.data && res.data.error) || 'Save failed', 'error');
  });

  async function payBill(id) {
    if (!confirm('Mark this bill as paid?')) return;
    const res = await api.post(`/bills/${id}/pay`, {});
    if (res && res.ok) { showToast('Payment recorded', 'success'); loadBills(); }
    else showToast('Failed', 'error');
  }

  async function deleteBill(id) {
    if (!confirm('Delete this bill?')) return;
    const res = await api.del(`/bills/${id}`);
    if (res && res.ok) { showToast('Bill deleted', 'success'); loadBills(); }
    else showToast('Delete failed', 'error');
  }

  async function viewInvoice(id) {
    const b = allBills.find(x => x.bill_id === id);
    if (!b) return;
    document.getElementById('invoiceContent').innerHTML = `
      <div style="border:1px solid #eee;border-radius:8px;padding:20px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
          <div><h3 style="color:#1a73e8;margin:0;">Hospital Management System</h3><small style="color:#666;">Invoice</small></div>
          <div style="text-align:right;">
            <strong>INV-${b.bill_id.toString().padStart(4,'0')}</strong><br/>
            <small>${b.date}</small>
          </div>
        </div>
        <hr/>
        <table style="width:100%;font-size:0.9rem;margin-top:12px;">
          <tr><td style="padding:6px;color:#666;">Patient</td><td><strong>${b.patient_name}</strong></td></tr>
          ${b.appointment_id ? `<tr><td style="padding:6px;color:#666;">Appointment</td><td>#${b.appointment_id}</td></tr>` : ''}
          <tr><td style="padding:6px;color:#666;">Status</td><td><span class="badge ${statusBadge(b.payment_status)}">${b.payment_status}</span></td></tr>
        </table>
        <div style="background:#f8faff;border-radius:8px;padding:16px;margin-top:16px;text-align:right;">
          <div style="font-size:0.85rem;color:#666;">Total Amount</div>
          <div style="font-size:1.8rem;font-weight:700;color:#1a73e8;">₹${b.amount.toLocaleString()}</div>
        </div>
      </div>`;
    document.getElementById('invoiceModal').classList.add('show');
  }

  document.getElementById('applyFilter').addEventListener('click', () =>
    loadBills({ status: document.getElementById('filterStatus').value }));

  document.getElementById('clearFilter').addEventListener('click', () => {
    document.getElementById('filterStatus').value = '';
    loadBills();
  });
</script>
</body>
</html>
