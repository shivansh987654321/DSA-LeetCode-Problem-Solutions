<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <h1><i class="bi bi-hospital"></i> HMS</h1>
      <p>Hospital Management System</p>
    </div>

    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="username" type="text" class="form-control" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Enter password" />
      </div>
      <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>
      <p id="loginError" style="color:#ea4335;font-size:0.85rem;margin-top:10px;text-align:center;"></p>
      <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:#666;">
        <a href="#" id="showResetLink" style="color:#1a73e8;">Forgot password?</a>
      </p>
    </div>

    <div id="resetForm" class="hidden">
      <p style="font-size:0.9rem;color:#555;margin-bottom:16px;">Enter your username and new password below.</p>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="resetUsername" type="text" class="form-control" placeholder="Your username" />
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input id="newPassword" type="password" class="form-control" placeholder="New password" />
      </div>
      <button id="resetBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">
        Reset Password
      </button>
      <p style="text-align:center;margin-top:12px;font-size:0.82rem;">
        <a href="#" id="showLoginLink" style="color:#1a73e8;">Back to login</a>
      </p>
    </div>

    <div style="margin-top:24px;padding:14px;background:#f8faff;border-radius:8px;font-size:0.78rem;color:#555;">
      <strong>Demo Credentials:</strong><br/>
      admin / admin123 &nbsp;|&nbsp; receptionist / recep123<br/>
      doctor / doctor123 &nbsp;|&nbsp; patient / patient123
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        document.getElementById('loginError').textContent = 'Please enter username and password.';
        return;
      }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Logging in…';

      const res = await api.post('/login', { username, password });
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';

      if (res && res.ok) {
        setToken(res.data.token);
        setUser(res.data.user);
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('loginError').textContent =
          (res && res.data && res.data.error) || 'Login failed. Please try again.';
      }
    });

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('showResetLink').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('resetForm').classList.remove('hidden');
    });

    document.getElementById('showLoginLink').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('resetForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const username = document.getElementById('resetUsername').value.trim();
      const new_password = document.getElementById('newPassword').value;
      if (!username || !new_password) { showToast('All fields required', 'error'); return; }

      const res = await api.post('/password/reset', { username, new_password });
      if (res && res.ok) {
        showToast('Password reset. Please login.', 'success');
        document.getElementById('resetForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
      } else {
        showToast((res && res.data && res.data.error) || 'Reset failed', 'error');
      }
    });
  </script>
</body>
</html>
