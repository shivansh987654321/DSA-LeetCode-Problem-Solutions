<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS — Appointments</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><h2><i class="bi bi-hospital"></i> HMS</h2><small>Hospital Management</small></div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto;">
      <a class="nav-item" id="logoutBtn" style="color:#f87171;"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <h3>Appointments</h3>
      <div class="topbar-right">
        <div class="user-badge">
          <div class="user-avatar" id="topbarAvatar">A</div>
          <div><div style="font-size:0.85rem;font-weight:600;" id="topbarUser">User</div>
          <div class="role-chip" id="topbarRole">role</div></div>
        </div>
      </div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h2>Appointment Management</h2>
        <button class="btn btn-primary" id="bookApptBtn"><i class="bi bi-plus-lg"></i> Book Appointment</button>
      </div>

      <!-- Filters -->
      <div class="card" style="margin-bottom:16px;">
        <div class="card-body" style="display:flex;gap:12px;flex-wrap:wrap;padding:14px 16px;">
          <select class="form-control" id="filterStatus" style="max-width:160px;">
            <option value="">All Statuses</option>
            <option>scheduled</option><option>completed</option><option>cancelled</option>
          </select>
          <input type="date" class="form-control" id="filterDate" style="max-width:180px;" />
          <button class="btn btn-secondary" id="applyFilter"><i class="bi bi-funnel"></i> Filter</button>
          <button class="btn btn-secondary" id="clearFilter"><i class="bi bi-x-circle"></i> Clear</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0;">
          <table class="table">
            <thead>
              <tr><th>#</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="apptTable">
              <tr><td colspan="7" style="text-align:center;padding:20px;color:#888;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Book / Edit Modal -->
<div class="modal-overlay" id="apptModal">
  <div class="modal-box">
    <div class="modal-header">
      <h4 id="apptModalTitle">Book Appointment</h4>
      <button class="modal-close" id="closeApptModal">&times;</button>
    </div>
    <input type="hidden" id="editApptId" />
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Patient *</label>
        <select class="form-control" id="apptPatient"><option value="">Select Patient…</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">Doctor *</label>
        <select class="form-control" id="apptDoctor"><option value="">Select Doctor…</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date *</label>
        <input type="date" class="form-control" id="apptDate" />
      </div>
      <div class="form-group">
        <label class="form-label">Time *</label>
        <select class="form-control" id="apptTime">
          <option value="">Select Time…</option>
          <option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option>
          <option>11:00</option><option>11:30</option><option>12:00</option><option>14:00</option>
          <option>14:30</option><option>15:00</option><option>15:30</option><option>16:00</option>
          <option>16:30</option><option>17:00</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="statusGroup" style="display:none;">
      <label class="form-label">Status</label>
      <select class="form-control" id="apptStatus">
        <option>scheduled</option><option>completed</option><option>cancelled</option>
      </select>
    </div>
    <div id="slotError" style="color:#ea4335;font-size:0.85rem;margin-bottom:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelApptModal">Cancel</button>
      <button class="btn btn-primary" id="saveAppt">Save Appointment</button>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  let currentUser = initPage('appointments');
  if (currentUser) { loadAppointments(); populateDropdowns(); }

  function statusBadge(s) {
    return { scheduled: 'badge-primary', completed: 'badge-success', cancelled: 'badge-danger' }[s] || 'badge-secondary';
  }

  async function loadAppointments(filters = {}) {
    let ep = '/appointments?';
    if (filters.status) ep += `status=${filters.status}&`;
    if (filters.date)   ep += `date=${filters.date}&`;
    const res = await api.get(ep);
    const tbody = document.getElementById('apptTable');
    if (!res || !res.ok) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#888;">Failed to load</td></tr>'; return; }

    const canManage = ['admin','receptionist'].includes(currentUser.role);
    const appts = res.data;
    if (!appts.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#888;">No appointments found</td></tr>';
      return;
    }
    tbody.innerHTML = appts.map(a => `
      <tr>
        <td>${a.appointment_id}</td>
        <td>${a.patient_name}</td>
        <td>${a.doctor_name}</td>
        <td>${a.date}</td>
        <td>${a.time}</td>
        <td><span class="badge ${statusBadge(a.status)}">${a.status}</span></td>
        <td>
          ${canManage ? `<button class="btn btn-secondary btn-sm btn-icon" onclick="editAppt(${a.appointment_id})"><i class="bi bi-pencil"></i></button>` : ''}
          ${(canManage || currentUser.role === 'patient') && a.status === 'scheduled' ? `<button class="btn btn-danger btn-sm btn-icon" onclick="cancelAppt(${a.appointment_id})"><i class="bi bi-x-circle"></i></button>` : ''}
        </td>
      </tr>`).join('');
  }

  async function populateDropdowns() {
    const [pRes, dRes] = await Promise.all([api.get('/patients'), api.get('/doctors')]);
    if (pRes && pRes.ok) {
      document.getElementById('apptPatient').innerHTML =
        '<option value="">Select Patient…</option>' +
        pRes.data.map(p => `<option value="${p.patient_id}">${p.name}</option>`).join('');
    }
    if (dRes && dRes.ok) {
      document.getElementById('apptDoctor').innerHTML =
        '<option value="">Select Doctor…</option>' +
        dRes.data.map(d => `<option value="${d.doctor_id}">${d.name} (${d.specialization || 'General'})</option>`).join('');
    }
  }

  const modal = document.getElementById('apptModal');
  document.getElementById('bookApptBtn').addEventListener('click', () => {
    document.getElementById('apptModalTitle').textContent = 'Book Appointment';
    document.getElementById('editApptId').value = '';
    document.getElementById('apptPatient').value = '';
    document.getElementById('apptDoctor').value = '';
    document.getElementById('apptDate').value = '';
    document.getElementById('apptTime').value = '';
    document.getElementById('slotError').textContent = '';
    document.getElementById('statusGroup').style.display = 'none';
    modal.classList.add('show');
  });

  document.getElementById('closeApptModal').addEventListener('click', () => modal.classList.remove('show'));
  document.getElementById('cancelApptModal').addEventListener('click', () => modal.classList.remove('show'));

  async function editAppt(id) {
    const res = await api.get(`/appointments/${id}`);
    if (!res || !res.ok) return;
    const a = res.data;
    document.getElementById('apptModalTitle').textContent = 'Edit Appointment';
    document.getElementById('editApptId').value = a.appointment_id;
    document.getElementById('apptPatient').value = a.patient_id;
    document.getElementById('apptDoctor').value = a.doctor_id;
    document.getElementById('apptDate').value = a.date;
    document.getElementById('apptTime').value = a.time;
    document.getElementById('apptStatus').value = a.status;
    document.getElementById('statusGroup').style.display = 'block';
    document.getElementById('slotError').textContent = '';
    modal.classList.add('show');
  }

  document.getElementById('saveAppt').addEventListener('click', async () => {
    const patient_id = document.getElementById('apptPatient').value;
    const doctor_id  = document.getElementById('apptDoctor').value;
    const date       = document.getElementById('apptDate').value;
    const time       = document.getElementById('apptTime').value;
    document.getElementById('slotError').textContent = '';

    if (!patient_id || !doctor_id || !date || !time) { showToast('All fields required', 'error'); return; }

    const editId = document.getElementById('editApptId').value;
    const body = { patient_id: parseInt(patient_id), doctor_id: parseInt(doctor_id), date, time };
    if (editId) body.status = document.getElementById('apptStatus').value;

    const res = editId ? await api.put(`/appointments/${editId}`, body) : await api.post('/appointments', body);
    if (res && res.ok) {
      showToast(editId ? 'Appointment updated' : 'Appointment booked', 'success');
      modal.classList.remove('show');
      loadAppointments();
    } else {
      const errMsg = (res && res.data && res.data.error) || 'Save failed';
      document.getElementById('slotError').textContent = errMsg;
    }
  });

  async function cancelAppt(id) {
    if (!confirm('Cancel this appointment?')) return;
    const res = await api.post(`/appointments/${id}/cancel`, {});
    if (res && res.ok) { showToast('Appointment cancelled', 'success'); loadAppointments(); }
    else showToast('Failed to cancel', 'error');
  }

  document.getElementById('applyFilter').addEventListener('click', () => {
    loadAppointments({
      status: document.getElementById('filterStatus').value,
      date: document.getElementById('filterDate').value,
    });
  });

  document.getElementById('clearFilter').addEventListener('click', () => {
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterDate').value = '';
    loadAppointments();
  });
</script>
</body>
</html>
